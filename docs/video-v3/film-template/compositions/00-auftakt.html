<!-- Auftakt (lib/film.mjs fuellt die {{…}}-Platzhalter): erst eine Bildfolge
     aus echten Szenen, je Stichwort ein Schnitt (content cards.intro), dann
     zum titleCue die Titelkarte mit Logo, Titel und Untertitel. -->
<template>
  <style>
    @font-face {
      font-family: "Noto Sans";
      font-weight: 400;
      src: url("assets/fonts/NotoSans-Regular-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Noto Sans";
      font-weight: 700;
      src: url("assets/fonts/NotoSans-Bold-latin.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "Noto Sans", sans-serif;
      color: #fff;
    }
    .a00-shot {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .a00-shot video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #a00-bg {
      position: absolute;
      inset: -60px;
      background: radial-gradient(ellipse at 50% 40%, #123457 0%, #0a1626 68%);
    }
    #a00-body {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      text-align: center;
    }
    #a00-logo {
      width: 150px;
      height: 150px;
      padding: 26px;
      border-radius: 34px;
      background: #0082c9;
      box-shadow: 0 24px 60px rgba(0, 130, 201, 0.35);
    }
    #a00-title {
      font-size: 105px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    #a00-sub {
      font-size: 44px;
      color: #c9d8e8;
    }
  </style>
  <div id="root" data-composition-id="a00" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
{{SHOTS}}
    <div id="a00-bg"></div>
    <div id="a00-body">
      <img id="a00-logo" src="assets/app.svg" alt="" />
      <div id="a00-title">{{TITLE}}</div>
      <div id="a00-sub">{{SUBTITLE}}</div>
    </div>
  </div>
  <script>
    (function () {
      const D = {{DATA}};
      const tl = gsap.timeline({ paused: true });
      // Bildfolge: jeder Ausschnitt mit leichter Fahrt nach innen.
      D.shots.forEach((s, i) => {
        tl.fromTo("#a00-shot" + i, { scale: 1.0 }, { scale: 1.07, duration: s.duration, ease: "none" }, s.start);
      });
      // Titelkarte zum titleCue: Grund und Schrift blenden mit Unschaerfe ein.
      const T = D.titleAt;
      tl.fromTo("#a00-bg", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, T);
      tl.fromTo("#a00-bg", { scale: 1 }, { scale: 1.06, duration: D.duration - T, ease: "none" }, T);
      tl.fromTo("#a00-body", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power2.out" }, T + 0.1);
      tl.fromTo("#a00-logo", { scale: 0.9 }, { scale: 1, duration: 1.0, ease: "power2.out" }, T + 0.1);
      tl.fromTo("#a00-title", { y: 18 }, { y: 0, duration: 1.0, ease: "power2.out" }, T + 0.1);
      tl.fromTo("#a00-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T + 0.6);
      tl.to("#a00-body", { opacity: 0, filter: "blur(14px)", duration: D.xfade, ease: "power2.in", immediateRender: false }, D.duration - D.xfade);
      window.__timelines["a00"] = tl;
    })();
  </script>
</template>
