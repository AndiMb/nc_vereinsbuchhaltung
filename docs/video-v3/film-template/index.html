<!doctype html>
<!-- Erzeugt von lib/film.mjs aus film-template/index.html - Aenderungen im
     Studio sind erlaubt; ein erneuter Lauf von film.mjs bricht dann ab und
     nennt die Datei (mit --force: alte Fassung wird gesichert). -->
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a1626;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #0a1626;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{TOTAL}}"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
{{HOSTS}}
{{VOICES}}
      <audio
        id="music"
        class="clip"
        src="assets/music.mp3"
        data-start="{{MUSIC_START}}"
        data-duration="{{MUSIC_DURATION}}"
        data-track-index="20"
        data-volume="0.22"
        data-fade-in="1.5"
        data-fade-out="3"
        data-automation='{{MUSIC_AUTOMATION}}'
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
