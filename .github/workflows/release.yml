name: Build & Release

# Baut die App bei jedem Versions-Tag (z. B. v0.10.18) und haengt das
# fertige Installations-Tarball an ein GitHub Release. Die Produktivserver
# ziehen dieses Tarball dann per vbh-deploy.sh.
#
# Sind die Secrets APP_PRIVATE_KEY / APP_PUBLIC_CRT gesetzt, wird die App
# zusaetzlich signiert (appinfo/signature.json). Ist ausserdem APPSTORE_TOKEN
# gesetzt, wird das Release an den Nextcloud App Store gemeldet.
# Fehlen die Secrets, laeuft der Build unveraendert durch - nur eben unsigniert
# und ohne Store-Upload.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # zum Anlegen des Releases

env:
  APP_ID: vereinsbuchhaltung

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version aus Tag ableiten
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Version gegen info.xml pruefen
        run: |
          xml_ver=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          if [ "$xml_ver" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} passt nicht zu info.xml-Version $xml_ver"
            exit 1
          fi

      - name: CHANGELOG-Eintrag pruefen
        # Der App Store zieht die Release-Notes aus dem passenden Abschnitt.
        run: |
          if ! grep -qF "## [${{ steps.ver.outputs.version }}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt '## [${{ steps.ver.outputs.version }}]'"
            exit 1
          fi

      - name: info.xml gegen App-Store-Schema validieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frontend bauen
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer-Autoloader (ohne Dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: App-Verzeichnis zusammenstellen
        run: |
          set -e
          STAGE="$RUNNER_TEMP/stage/$APP_ID"
          mkdir -p "$STAGE"
          # Alles kopieren ausser Entwicklungs-/Build-Ballast
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.eslintrc.cjs' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='tests' \
            --exclude='composer.phar' \
            --exclude='webpack.config.js' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.cache' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.map' \
            --exclude='*.log' \
            --exclude='*.mp3' \
            ./ "$STAGE/"

      - name: Signaturschluessel bereitstellen
        id: certs
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -e
          if [ -z "$APP_PRIVATE_KEY" ] || [ -z "$APP_PUBLIC_CRT" ]; then
            echo "::warning::APP_PRIVATE_KEY/APP_PUBLIC_CRT fehlen - Release wird unsigniert gebaut."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERTS="$RUNNER_TEMP/certs"
          mkdir -p "$CERTS" && chmod 700 "$CERTS"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$CERTS/$APP_ID.key"
          printf '%s\n' "$APP_PUBLIC_CRT"  > "$CERTS/$APP_ID.crt"
          chmod 600 "$CERTS/$APP_ID.key" "$CERTS/$APP_ID.crt"

          # Schluessel und Zertifikat sofort pruefen, nicht erst wenn drei
          # Schritte spaeter eine leere Signatur beim App Store auflaeuft.
          if ! openssl rsa -in "$CERTS/$APP_ID.key" -check -noout >/dev/null 2>&1 \
             && ! openssl pkey -in "$CERTS/$APP_ID.key" -noout >/dev/null 2>&1; then
            echo "::error::APP_PRIVATE_KEY ist kein lesbarer privater Schluessel (PEM erwartet)."
            exit 1
          fi
          if ! openssl x509 -in "$CERTS/$APP_ID.crt" -noout >/dev/null 2>&1; then
            echo "::error::APP_PUBLIC_CRT ist kein lesbares Zertifikat (PEM erwartet)."
            exit 1
          fi
          # Gehoeren die beiden zusammen? Sonst signiert man gegen ein
          # Zertifikat, das der Store nicht akzeptiert.
          KEY_MOD=$(openssl pkey -in "$CERTS/$APP_ID.key" -pubout -outform der 2>/dev/null | openssl dgst -sha256 | awk '{print $2}')
          CRT_MOD=$(openssl x509 -in "$CERTS/$APP_ID.crt" -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 | awk '{print $2}')
          if [ "$KEY_MOD" != "$CRT_MOD" ]; then
            echo "::error::APP_PRIVATE_KEY und APP_PUBLIC_CRT gehoeren nicht zusammen."
            exit 1
          fi
          echo "Schluessel und Zertifikat sind lesbar und passen zueinander."
          echo "signing=true" >> "$GITHUB_OUTPUT"

      - name: App signieren (appinfo/signature.json)
        if: steps.certs.outputs.signing == 'true'
        run: |
          set -e
          # occ aus dem offiziellen Nextcloud-Image: integrity:sign-app braucht
          # keine installierte Instanz, nur den Server-Quellcode.
          docker run --rm \
            -v "$RUNNER_TEMP/stage:/stage" \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            nextcloud:stable \
            php /usr/src/nextcloud/occ integrity:sign-app \
              --path="/stage/$APP_ID" \
              --privateKey="/certs/$APP_ID.key" \
              --certificate="/certs/$APP_ID.crt"
          if [ ! -f "$RUNNER_TEMP/stage/$APP_ID/appinfo/signature.json" ]; then
            echo "::error::signature.json wurde nicht erzeugt"
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/stage/$APP_ID"

      - name: Paket schnueren
        run: |
          set -e
          VER=${{ steps.ver.outputs.version }}
          tar -czf "$RUNNER_TEMP/$APP_ID-$VER.tar.gz" -C "$RUNNER_TEMP/stage" "$APP_ID"
          ( cd "$RUNNER_TEMP" && sha256sum "$APP_ID-$VER.tar.gz" > "$APP_ID-$VER.tar.gz.sha256" )

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/vereinsbuchhaltung-${{ steps.ver.outputs.version }}.tar.gz
            ${{ runner.temp }}/vereinsbuchhaltung-${{ steps.ver.outputs.version }}.tar.gz.sha256
          generate_release_notes: true

      - name: Store-Upload vorbereiten
        id: store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          if [ "${{ steps.certs.outputs.signing }}" = "true" ] && [ -n "$APPSTORE_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Kein Store-Upload (APPSTORE_TOKEN oder Signierung fehlt)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Bewusst ein direkter Aufruf statt einer fertigen Action:
      # R0Wi/nextcloud-appstore-push-action schrieb den privaten Schluessel per
      # `echo "${{ inputs.app_private_key }}"` aus einer Template-Ersetzung in
      # eine Datei. openssl konnte die anschliessend nicht lesen ("Could not
      # read private key"), die Action schickte daraufhin eine LEERE Signatur -
      # und der Store lehnte mit 400 {"signature":["This field may not be
      # blank."]} ab. Schlimm daran: der fehlgeschlagene Signaturschritt brach
      # nicht ab, der Fehler fiel erst beim Store auf.
      # Der Schluessel liegt hier ohnehin schon entpackt (Schritt "Signatur-
      # schluessel bereitstellen") und hat dort nachweislich funktioniert - also
      # verwenden wir genau diese Datei.
      - name: An Nextcloud App Store melden
        if: steps.store.outputs.publish == 'true'
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/vereinsbuchhaltung-${{ steps.ver.outputs.version }}.tar.gz
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/certs/$APP_ID.key"
          TARBALL="$RUNNER_TEMP/$APP_ID-$VER.tar.gz"
          [ -s "$KEY" ]     || { echo "::error::Schluesseldatei fehlt oder ist leer: $KEY"; exit 1; }
          [ -s "$TARBALL" ] || { echo "::error::Tarball fehlt: $TARBALL"; exit 1; }

          # Signatur ueber genau das Paket, das unter DOWNLOAD_URL liegt.
          SIGNATURE=$(openssl dgst -sha512 -sign "$KEY" "$TARBALL" | openssl base64 -A)
          if [ -z "$SIGNATURE" ]; then
            echo "::error::Signatur ist leer - der Store wuerde sie ablehnen."
            exit 1
          fi
          echo "Signatur erzeugt (${#SIGNATURE} Zeichen)."

          # Antwortkoerper mit ausgeben: die Fehlermeldung des Stores ist die
          # einzige brauchbare Diagnose, wenn etwas nicht passt.
          PAYLOAD=$(mktemp)
          printf '{"download":"%s","signature":"%s","nightly":false}' "$DOWNLOAD_URL" "$SIGNATURE" > "$PAYLOAD"
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST \
            https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$PAYLOAD")
          rm -f "$PAYLOAD"

          echo "App Store antwortete mit HTTP $STATUS"
          cat "$BODY"; echo
          case "$STATUS" in
            200|201) echo "::notice::$APP_ID $VER im Nextcloud App Store veroeffentlicht." ;;
            *) echo "::error::Store-Upload fehlgeschlagen (HTTP $STATUS)."; exit 1 ;;
          esac
