name: Build & Release

# Baut die App bei jedem Versions-Tag (z. B. v0.10.18) und haengt das
# fertige Installations-Tarball an ein GitHub Release. Die Produktivserver
# ziehen dieses Tarball dann per vbh-deploy.sh.
#
# Sind die Secrets APP_PRIVATE_KEY / APP_PUBLIC_CRT gesetzt, wird die App
# zusaetzlich signiert (appinfo/signature.json). Ist ausserdem APPSTORE_TOKEN
# gesetzt, wird das Release an den Nextcloud App Store gemeldet
# (appstore-publish.yml).
# Fehlen die Secrets, laeuft der Build unveraendert durch - nur eben unsigniert
# und ohne Store-Upload.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # zum Anlegen des Releases

env:
  APP_ID: vereinsbuchhaltung

jobs:
  # Die komplette CI (Lint, Unit-Tests, PHPStan, php-cs-fixer, E2E gegen
  # eine echte Nextcloud, info.xml-Schema) als Pflicht-Vorstufe: eine
  # Version, die diese Pruefungen nicht besteht, wird gar nicht erst gebaut.
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version aus Tag ableiten
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Version gegen info.xml pruefen
        run: |
          xml_ver=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          if [ "$xml_ver" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} passt nicht zu info.xml-Version $xml_ver"
            exit 1
          fi

      - name: CHANGELOG-Eintrag pruefen
        # Der App Store zieht die Release-Notes aus dem passenden Abschnitt.
        run: |
          if ! grep -qF "## [${{ steps.ver.outputs.version }}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt '## [${{ steps.ver.outputs.version }}]'"
            exit 1
          fi

      - name: info.xml gegen App-Store-Schema validieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Frontend bauen
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer-Autoloader (ohne Dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: TCPDF auf die benötigten Schriften kürzen
        # TCPDF bringt rund 24 MB Schriften mit, die Rechnungen nutzen nur
        # DejaVu Sans (vier Schnitte, eingebettet wegen PDF/A) und die
        # winzigen Definitionen der Standardschriften. Der Rest bläht den
        # App-Store-Tarball nur auf. Beispiele und Werkzeuge fliegen ebenfalls raus.
        run: |
          set -e
          TCPDF=vendor/tecnickcom/tcpdf
          rm -rf "$TCPDF/examples" "$TCPDF/tools"
          cd "$TCPDF/fonts"
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'dejavusans.*' ! -name 'dejavusansb.*' ! -name 'dejavusansi.*' ! -name 'dejavusansbi.*' \
            ! -name 'helvetica*' ! -name 'times*' ! -name 'courier*' ! -name 'pdfa*' \
            ! -name 'symbol.php' ! -name 'zapfdingbats.php' ! -name 'index.php' \
            -exec rm -rf {} +
          du -sh .

      - name: App-Verzeichnis zusammenstellen
        run: |
          set -e
          STAGE="$RUNNER_TEMP/stage/$APP_ID"
          mkdir -p "$STAGE"
          # Alles kopieren ausser Entwicklungs-/Build-Ballast
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='eslint.config.mjs' \
            --exclude='stylelint.config.cjs' \
            --exclude='.nvmrc' \
            --exclude='.php-cs-fixer' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='.php-cs-fixer.cache' \
            --exclude='playwright.config.mjs' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            --exclude='vitest.config.mjs' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='composer.phar' \
            --exclude='webpack.config.js' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.cache' \
            --exclude='phpstan.neon' \
            --exclude='.phpstan' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.map' \
            --exclude='*.log' \
            --exclude='*.mp3' \
            --exclude='SEPA-STAND.md' \
            ./ "$STAGE/"

      - name: Signaturschluessel bereitstellen
        id: certs
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -e
          if [ -z "$APP_PRIVATE_KEY" ] || [ -z "$APP_PUBLIC_CRT" ]; then
            echo "::warning::APP_PRIVATE_KEY/APP_PUBLIC_CRT fehlen - Release wird unsigniert gebaut."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERTS="$RUNNER_TEMP/certs"
          mkdir -p "$CERTS" && chmod 700 "$CERTS"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$CERTS/$APP_ID.key"
          printf '%s\n' "$APP_PUBLIC_CRT"  > "$CERTS/$APP_ID.crt"
          chmod 600 "$CERTS/$APP_ID.key" "$CERTS/$APP_ID.crt"

          # Windows-Zeilenenden entfernen - schadet einer sauberen Datei nicht.
          sed -i 's/\r$//' "$CERTS/$APP_ID.key" "$CERTS/$APP_ID.crt"

          # Beide Secrets pruefen, BEVOR irgendetwas signiert wird.
          #
          # Der Grund fuer diese Strenge: occ integrity:sign-app meldet Erfolg
          # und schreibt eine signature.json auch dann, wenn es weder Schluessel
          # noch Zertifikat lesen konnte. Die Signatur ist dann wertlos, und das
          # faellt erst beim App Store oder beim Integritaetscheck einer
          # Instanz auf - weit weg von der Ursache. Beim ersten
          # Veroeffentlichungsversuch waren in beiden Secrets die
          # -----BEGIN ...----- / -----END ...-----Zeilen nicht mitkopiert
          # worden; die Fehlersuche kostete mehrere Release-Laeufe.
          fehler=0
          if ! openssl pkey -in "$CERTS/$APP_ID.key" -noout 2>/dev/null; then
            echo "::error::APP_PRIVATE_KEY ist kein lesbarer PEM-Schluessel. Enthaelt das Secret die Zeilen -----BEGIN PRIVATE KEY----- und -----END PRIVATE KEY-----?"
            fehler=1
          fi
          if ! openssl x509 -in "$CERTS/$APP_ID.crt" -noout 2>/dev/null; then
            echo "::error::APP_PUBLIC_CRT ist kein lesbares PEM-Zertifikat. Enthaelt das Secret die Zeilen -----BEGIN CERTIFICATE----- und -----END CERTIFICATE-----?"
            fehler=1
          fi
          [ "$fehler" -eq 0 ] || exit 1

          # Gehoeren die beiden zusammen? Sonst entstuende eine Signatur, die
          # gegen das mitgelieferte Zertifikat nicht aufgeht.
          KEY_PUB=$(openssl pkey -in "$CERTS/$APP_ID.key" -pubout)
          CRT_PUB=$(openssl x509 -in "$CERTS/$APP_ID.crt" -pubkey -noout)
          if [ "$KEY_PUB" != "$CRT_PUB" ]; then
            echo "::error::APP_PRIVATE_KEY und APP_PUBLIC_CRT gehoeren nicht zusammen."
            exit 1
          fi
          echo "Schluessel und Zertifikat sind lesbar und gehoeren zusammen."
          echo "signing=true" >> "$GITHUB_OUTPUT"

      - name: App signieren (appinfo/signature.json)
        if: steps.certs.outputs.signing == 'true'
        run: |
          set -e
          # occ aus dem offiziellen Nextcloud-Image: integrity:sign-app braucht
          # keine installierte Instanz, nur den Server-Quellcode.
          docker run --rm \
            -v "$RUNNER_TEMP/stage:/stage" \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            nextcloud:stable \
            php /usr/src/nextcloud/occ integrity:sign-app \
              --path="/stage/$APP_ID" \
              --privateKey="/certs/$APP_ID.key" \
              --certificate="/certs/$APP_ID.crt"
          if [ ! -f "$RUNNER_TEMP/stage/$APP_ID/appinfo/signature.json" ]; then
            echo "::error::signature.json wurde nicht erzeugt"
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/stage/$APP_ID"

      - name: Paket schnueren
        run: |
          set -e
          VER=${{ steps.ver.outputs.version }}
          tar -czf "$RUNNER_TEMP/$APP_ID-$VER.tar.gz" -C "$RUNNER_TEMP/stage" "$APP_ID"
          ( cd "$RUNNER_TEMP" && sha256sum "$APP_ID-$VER.tar.gz" > "$APP_ID-$VER.tar.gz.sha256" )

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ runner.temp }}/vereinsbuchhaltung-${{ steps.ver.outputs.version }}.tar.gz
            ${{ runner.temp }}/vereinsbuchhaltung-${{ steps.ver.outputs.version }}.tar.gz.sha256
          generate_release_notes: true

  # Die Meldung an den App Store als eigener Workflow: er wartet, bis GitHub
  # das eben hochgeladene Tarball verlaesslich ausliefert, wiederholt
  # Fehlschlaege und laesst sich fuer ein bestehendes Release von Hand
  # nachholen (siehe appstore-publish.yml).
  appstore:
    needs: build
    uses: ./.github/workflows/appstore-publish.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
