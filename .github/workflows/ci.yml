name: CI

# Laeuft bei jedem Push und Pull Request auf main. Bewusst getrennt vom
# Release-Workflow (release.yml), der nur bei Versions-Tags greift: Fehler
# sollen auffallen, bevor ein Tag gesetzt wird, nicht erst beim Veroeffentlichen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Der Release-Workflow ruft diese Pruefungen als Pflicht-Vorstufe auf:
  # was hier rot ist, wird nicht veroeffentlicht.
  workflow_call:

jobs:
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Unit-Tests (Vitest)
        # Deckt die zustandslosen Module unter src/lib ab. Der Rest des
        # Frontends braucht eine laufende Nextcloud-Instanz und gehoert in
        # Integrationstests - genau wie im Backend, siehe phpunit.xml.
        run: npm test

      - name: Produktions-Build
        # Faengt fehlende Abhaengigkeiten ab, die lokal nur zufaellig ueber
        # node_modules eines anderen Pakets aufloesen.
        run: npm run build

  backend:
    name: Backend (PHP-Syntax + Unit-Tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spanne aus appinfo/info.xml
        php-version: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, phpunit:10.5
          coverage: none

      - name: Syntaxpruefung aller PHP-Dateien
        run: find lib appinfo tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: composer.json/lock validieren
        run: composer validate --strict --no-check-publish

      - name: PHPUnit
        # Braucht keinen composer-Autoloader: tests/bootstrap.php laedt die
        # Klassen per PSR-4 direkt aus lib/ (siehe Kommentar dort).
        run: phpunit --configuration phpunit.xml

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # Die niedrigste unterstuetzte Version: was hier durchgeht, laeuft
          # auch auf den neueren. .phpstan/composer.json setzt dieselbe Plattform.
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Analyse-Stubs und PHPStan holen
        # Nextcloud-Server-Schnittstellen (OCP\*), PHPUnit und PHPStan selbst
        # als eigenes composer-Projekt unter .phpstan/ - ausserhalb der
        # composer.json der App, damit deren Abhaengigkeitsliste leer bleibt
        # und kein Fremdcode ins Release-Tarball geraet. PHPStan bewusst per
        # composer.lock hier fixiert statt ueber setup-php's 'tools:'
        # installiert: eine ungepinnte 'latest' PHPStan-Version driftet sonst
        # unbemerkt zwischen CI-Laeufen, siehe Issue #2.
        run: composer install --working-dir=.phpstan --no-interaction --no-progress

      - name: PHPStan
        run: .phpstan/vendor/bin/phpstan analyse --no-progress

  coding-standard:
    name: php-cs-fixer (Nextcloud-Coding-Standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Werkzeug holen
        # Eigenes composer-Projekt unter .php-cs-fixer/, per composer.lock
        # fixiert - dasselbe Muster wie .phpstan/ und aus demselben Grund:
        # die composer.json der App bleibt leer, und CI wie lokale Laeufe
        # pruefen mit derselben Werkzeug-Version.
        run: composer install --working-dir=.php-cs-fixer --no-interaction --no-progress

      - name: Formatpruefung
        run: .php-cs-fixer/vendor/bin/php-cs-fixer fix --dry-run --diff

  e2e:
    name: E2E (Playwright gegen Docker-Nextcloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Playwright-Browser-Cache
        # Spart den Chromium-Download (~150 MB) bei unveraenderter
        # Playwright-Version; 'playwright install' erkennt den Cache selbst.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Produktions-Build
        # Der Testserver mountet das App-Verzeichnis - die Tests laufen
        # gegen genau die Bundles, die auch ausgeliefert wuerden.
        run: npm run build

      - name: Testserver starten (Docker-Nextcloud stable34)
        # Kehrt erst zurueck, wenn die Instanz eingerichtet und der
        # "init"-Snapshot angelegt ist - ein eigener Warteschritt entfaellt.
        run: npm run test:e2e:server

      - name: E2E-Tests
        run: npm run test:e2e:run

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  appinfo:
    name: info.xml gegen App-Store-Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: xmllint installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validieren
        run: |
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd appinfo/info.xml
